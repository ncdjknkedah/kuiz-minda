<style>

<body>
<div id="app"></div>

<script type="module">
/* =====================================================================
   1) TETAPAN — tampal konfigurasi Firebase anda di bawah
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyDAYL-WzECWagSRWoOfe2KUAT4WwU6_Cug",
  authDomain: "kuiz-minda.firebaseapp.com",
  projectId: "kuiz-minda",
  storageBucket: "kuiz-minda.firebasestorage.app",
  messagingSenderId: "470548794507",
  appId: "1:470548794507:web:10fb047cdd28b2d2a7988e",
  measurementId: "G-D3414KFNNK"
};
const HOST_PIN = "2026";          // PIN untuk skrin hos
const QUESTION_TIME = 30;         // saat setiap soalan
const TITLE = "Kuiz Mitos vs Fakta";
const SUBTITLE = "Seminar Fiqh Kesihatan Mental 2026";

/* 2) SOALAN — a: true = BETUL (fakta), false = SALAH (mitos) */
const QUESTIONS = [
  { t: "Masalah kesihatan mental berlaku kerana lemah iman.", a: false,
    e: "Penyakit mental melibatkan fungsi otak, genetik dan tekanan hidup. Orang yang kuat beragama juga boleh sakit. Berubat ialah ikhtiar — seiring dengan tawakal." },
  { t: "Pesakit mental biasanya ganas dan berbahaya.", a: false,
    e: "Kebanyakan pesakit mental tidak ganas. Mereka lebih berisiko menjadi mangsa buli, ejekan dan diskriminasi." },
  { t: "Bertanya terus tentang niat bunuh diri boleh menanam idea itu.", a: false,
    e: "Bertanya dengan tenang dan prihatin membuka pintu untuk bercerita — dan mendapatkan bantuan." },
  { t: "Penyakit mental boleh dirawat, dan pesakit boleh pulih serta bekerja seperti biasa.", a: true,
    e: "Dengan rawatan awal dan sokongan, ramai pesakit kembali berfungsi dan produktif." },
  { t: "Ubat psikiatri menyebabkan ketagihan dan perlu dimakan seumur hidup.", a: false,
    e: "Kebanyakan ubat psikiatri tidak menyebabkan ketagihan. Tempoh rawatan bergantung pada keadaan, ditentukan bersama doktor. Jangan berhenti sendiri." },
  { t: "Kanak-kanak dan remaja juga boleh mengalami masalah kesihatan mental.", a: true,
    e: "1 daripada 6 kanak-kanak di Malaysia mengalami masalah kesihatan mental (NHMS 2023)." }
];

/* ===================================================================== */
const FB = "https://www.gstatic.com/firebasejs/10.12.2/";
const params = new URLSearchParams(location.search);
const IS_HOST = params.has("host");
const DEMO = params.has("demo") || !firebaseConfig.apiKey;
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const N = QUESTIONS.length;
function explain(e) {
  const c = String(e?.code || e?.message || e);
  if (c.includes("permission-denied")) return "Akses ditolak oleh Firestore. Semak tab <b>Rules</b> → tampal peraturan dari panduan → <b>Publish</b>.";
  if (c.includes("not-found") || c.includes("NOT_FOUND")) return "Pangkalan data Firestore belum dicipta. Firebase → Firestore → <b>Create database</b>.";
  if (c.includes("unavailable") || c.includes("offline") || c.includes("timeout")) return "Tidak dapat menghubungi Firestore. Semak internet, dan pastikan Firestore sudah dicipta.";
  if (c.includes("Failed to fetch") || c.includes("import")) return "Gagal memuatkan Firebase. Semak sambungan internet.";
  return esc(c);
}
function showError(e, where) {
  console.error(where, e);
  app.innerHTML = `<div class="p-wrap"><div class="p-center"><div class="big-ic" style="background:rgba(255,77,94,.2);color:var(--red)">!</div>
    <h2 class="disp" style="font-size:36px">Tidak dapat menyambung</h2><p style="color:var(--soft);line-height:1.5">${explain(e)}</p>
    <p style="font-size:12px;color:var(--soft);opacity:.6">${esc(where)}: ${esc(e?.code || e?.message || e)}</p>
    <button class="btn" onclick="location.reload()">Cuba semula</button></div></div>`;
}
const withTimeout = (p, ms = 12000) => Promise.race([p, new Promise((_, r) => setTimeout(() => r(new Error("timeout")), ms))]);

/* ---------- storage adapters ---------- */
async function firebaseAdapter() {
  const { initializeApp } = await import(FB + "firebase-app.js");
  const fs = await import(FB + "firebase-firestore.js");
  const db = fs.getFirestore(initializeApp(firebaseConfig));
  const list = s => s.docs.map(x => ({ id: x.id, ...x.data() }));
  return {
    async getGame(g) { const s = await fs.getDoc(fs.doc(db, "games", g)); return s.exists() ? s.data() : null; },
    setGame: (g, d) => fs.setDoc(fs.doc(db, "games", g), d, { merge: true }),
    watchGame: (g, cb) => fs.onSnapshot(fs.doc(db, "games", g), s => cb(s.exists() ? s.data() : null), e => showError(e, "watchGame")),
    addPlayer: (g, id, d) => fs.setDoc(fs.doc(db, "games", g, "players", id), d, { merge: true }),
    watchPlayers: (g, cb) => fs.onSnapshot(fs.collection(db, "games", g, "players"), s => cb(list(s)), e => console.error(e)),
    addAnswer: (g, id, d) => fs.setDoc(fs.doc(db, "games", g, "answers", id), d),
    watchAnswers: (g, cb) => fs.onSnapshot(fs.collection(db, "games", g, "answers"), s => cb(list(s)), e => console.error(e))
  };
}
function localAdapter() {
  const bc = new BroadcastChannel("kuiz-demo"), subs = [];
  const K = k => "kuizdemo:" + k;
  const read = k => JSON.parse(localStorage.getItem(K(k)) || "null");
  const fire = k => subs.forEach(s => k === s.key && s.fn());
  const write = (k, v) => { localStorage.setItem(K(k), JSON.stringify(v)); bc.postMessage(k); fire(k); };
  bc.onmessage = e => fire(e.data);
  const sub = (key, fn) => { const s = { key, fn }; subs.push(s); setTimeout(fn, 0); return () => subs.splice(subs.indexOf(s), 1); };
  const coll = (g, c) => read(`${g}/${c}`) || {};
  const arr = o => Object.entries(o).map(([id, v]) => ({ id, ...v }));
  return {
    async getGame(g) { return read("game/" + g); },
    async setGame(g, d) { write("game/" + g, { ...(read("game/" + g) || {}), ...d }); },
    watchGame: (g, cb) => sub("game/" + g, () => cb(read("game/" + g))),
    async addPlayer(g, id, d) { const c = coll(g, "players"); c[id] = { ...(c[id] || {}), ...d }; write(`${g}/players`, c); },
    watchPlayers: (g, cb) => sub(`${g}/players`, () => cb(arr(coll(g, "players")))),
    async addAnswer(g, id, d) { const c = coll(g, "answers"); c[id] = d; write(`${g}/answers`, c); },
    watchAnswers: (g, cb) => sub(`${g}/answers`, () => cb(arr(coll(g, "answers"))))
  };
}

/* ---------- scoring ---------- */
function scoreTable(players, answers) {
  const sc = {};
  players.forEach(p => sc[p.id] = { id: p.id, name: p.name, score: 0, right: 0 });
  answers.forEach(a => { if (!sc[a.pid]) sc[a.pid] = { id: a.pid, name: a.name, score: 0, right: 0 }; sc[a.pid].score += a.points || 0; if (a.correct) sc[a.pid].right++; });
  return Object.values(sc).sort((x, y) => y.score - x.score || y.right - x.right || String(x.name).localeCompare(String(y.name)));
}

/* ======================================================================
   MUZIK (asli, dijana oleh Web Audio — hanya pada skrin hos)
   ====================================================================== */
const Music = (() => {
  let ctx = null, master = null, timer = null, mode = null, step = 0, nextT = 0, nbuf = null;
  let muted = localStorage.getItem("kuiz-mute") === "1";
  const midi = n => 440 * Math.pow(2, (n - 69) / 12);
  function ensure() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
      ctx = new AC(); master = ctx.createGain(); master.gain.value = muted ? 0 : 0.55; master.connect(ctx.destination);
      nbuf = ctx.createBuffer(1, ctx.sampleRate * 0.2, ctx.sampleRate); const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ctx.state === "suspended") ctx.resume();
    return true;
  }
  function note(n, t, dur, type = "square", g = 0.06) {
    const o = ctx.createOscillator(), v = ctx.createGain();
    o.type = type; o.frequency.value = midi(n);
    v.gain.setValueAtTime(0.0001, t); v.gain.linearRampToValueAtTime(g, t + 0.01); v.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(v).connect(master); o.start(t); o.stop(t + dur + 0.05);
  }
  function hat(t, g = 0.05) {
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), v = ctx.createGain();
    s.buffer = nbuf; f.type = "highpass"; f.frequency.value = 7000;
    v.gain.setValueAtTime(g, t); v.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    s.connect(f).connect(v).connect(master); s.start(t); s.stop(t + 0.06);
  }
  function kick(t) {
    const o = ctx.createOscillator(), v = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    v.gain.setValueAtTime(0.35, t); v.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    o.connect(v).connect(master); o.start(t); o.stop(t + 0.2);
  }
  // Lobi: ceria & santai (C – Am – F – G), 8th notes @ 120bpm
  const LOBBY = { dur: 0.25, len: 32, chords: [[60, 64, 67], [57, 60, 64], [53, 57, 60], [55, 59, 62]] };
  // Soalan: tegang (E minor pulse) 16ths @ 150bpm
  const QUEST = { dur: 0.1, len: 32, roots: [40, 40, 43, 38] };
  function playStep(t) {
    if (mode === "lobby") {
      const s = step % LOBBY.len, ch = LOBBY.chords[Math.floor(s / 8)];
      if (s % 8 === 0) note(ch[0] - 24, t, 0.45, "triangle", 0.16);
      if (s % 8 === 4) note(ch[0] - 12, t, 0.3, "triangle", 0.1);
      note(ch[s % 3] + 12, t, 0.18, "square", 0.035);
      if (s % 4 === 2) hat(t, 0.03);
      if (s % 4 === 0) kick(t);
    } else if (mode === "question") {
      const s = step % QUEST.len, r = QUEST.roots[Math.floor(s / 8)];
      if (s % 2 === 0) note(r, t, 0.09, "sawtooth", 0.07);
      if (s % 4 === 0) kick(t);
      hat(t, s % 2 ? 0.02 : 0.035);
      if (s % 8 === 6) note(r + 31, t, 0.08, "square", 0.03);
    }
  }
  function loop() {
    if (!ctx || !mode) return;
    const D = mode === "lobby" ? LOBBY.dur : QUEST.dur;
    while (nextT < ctx.currentTime + 0.15) { playStep(nextT); nextT += D; step++; }
  }
  function seq(notes, type = "square", g = 0.08, gap = 0.11) {
    if (!ensure()) return; const t0 = ctx.currentTime + 0.05;
    notes.forEach((n, i) => n && note(n, t0 + i * gap, gap * 2.2, type, g));
  }
  return {
    play(m) {
      if (mode === m) return; mode = m; clearInterval(timer);
      if (!m || !ensure()) return;
      step = 0; nextT = ctx.currentTime + 0.05; timer = setInterval(loop, 25);
    },
    stop() { this.play(null); },
    tick(left) { if (ensure()) note(left <= 3 ? 88 : 84, ctx.currentTime + 0.01, 0.12, "square", 0.08); },
    timeUp() { seq([76, 72, 67, 60], "sawtooth", 0.07, 0.09); },
    reveal() { seq([72, 76, 79, 84, 0, 88], "square", 0.07, 0.1); },
    board() { if (!ensure()) return; kick(ctx.currentTime); seq([67, 0, 72, 0, 76, 79], "triangle", 0.12, 0.12); },
    fanfare() { seq([67, 72, 76, 79, 0, 76, 79, 84, 84, 84], "square", 0.08, 0.14); },
    join() { if (ctx && !muted) note(91, ctx.currentTime + 0.01, 0.12, "triangle", 0.05); },
    unlock() { ensure(); },
    get muted() { return muted; },
    toggle() { muted = !muted; localStorage.setItem("kuiz-mute", muted ? "1" : "0"); if (ensure()) master.gain.value = muted ? 0 : 0.55; return muted; }
  };
})();

/* ======================================================================
   HOST
   ====================================================================== */
async function host(AP) {
  if (sessionStorage.getItem("kuiz-host") !== HOST_PIN) {
    app.innerHTML = `<div class="p-wrap"><div class="p-center"><p class="eyebrow">Skrin hos</p><h1 class="disp gold" style="font-size:56px">${esc(TITLE)}</h1>
      <input id="pin" type="password" inputmode="numeric" placeholder="PIN hos"><button class="btn" id="go">Masuk</button></div></div>`;
    await new Promise(res => {
      const go = () => { const el = document.getElementById("pin"); if (el.value.trim() === HOST_PIN) { sessionStorage.setItem("kuiz-host", HOST_PIN); document.getElementById("go").textContent = "Menyambung…"; res(); } else { el.value = ""; el.placeholder = "PIN salah — cuba lagi"; } };
      document.getElementById("go").onclick = go;
      document.getElementById("pin").onkeydown = e => { if (e.key === "Enter") go(); };
    });
  }
  let A;
  try { A = await AP; } catch (e) { return showError(e, "muat Firebase"); }
  let g = params.get("g");
  if (!g) { g = String(Math.floor(1000 + Math.random() * 9000)); history.replaceState(null, "", `?host&g=${g}${DEMO && params.has("demo") ? "&demo" : ""}`); }
  try {
    if (!(await withTimeout(A.getGame(g)))) await withTimeout(A.setGame(g, { state: "lobby", q: -1, created: Date.now() }));
  } catch (e) { return showError(e, "hos"); }

  const base = location.origin + location.pathname;
  const joinUrl = `${base}?g=${g}${params.has("demo") ? "&demo" : ""}`;
  let game = null, players = [], answers = [], tick = null, busy = false;

  const setState = async d => { if (busy) return; busy = true; try { await A.setGame(g, d); } finally { busy = false; } };
  const qAnswers = q => answers.filter(a => a.q === q);
  const ranksPayload = () => {
    const t = scoreTable(players, answers), ranks = {};
    t.forEach((p, i) => ranks[p.id] = i + 1);
    return { ranks, total: t.length, top: t.slice(0, 10).map(p => ({ name: p.name, score: p.score })) };
  };
  async function next() {
    if (!game) return;
    const { state, q } = game;
    if (state === "lobby") return setState({ state: "question", q: 0, qStart: Date.now() });
    if (state === "question") return setState({ state: "reveal" });
    if (state === "reveal") return setState({ state: q >= N - 1 ? "end" : "board", ...ranksPayload() });
    if (state === "board") return setState({ state: "question", q: q + 1, qStart: Date.now() });
  }
  async function newGame() {
    if (!confirm("Mula permainan baharu dengan kod baharu?")) return;
    location.href = `${base}?host${params.has("demo") ? "&demo" : ""}`;
  }
  document.addEventListener("pointerdown", () => Music.unlock());
  document.addEventListener("keydown", e => {
    Music.unlock();
    if (e.key === "m" || e.key === "M") { Music.toggle(); const b = document.getElementById("mu"); if (b) b.textContent = Music.muted ? "🔇 Muzik" : "🔊 Muzik"; return; }
    if ([" ", "ArrowRight", "Enter", "PageDown"].includes(e.key)) { e.preventDefault(); next(); }
  });
  let lastKey = null, lastLeft = null;
  function sound() {
    const key = game.state + ":" + game.q; if (key === lastKey) return;
    const prev = lastKey; lastKey = key;
    if (game.state === "lobby") Music.play("lobby");
    else if (game.state === "question") { lastLeft = null; Music.play("question"); }
    else if (game.state === "reveal") { Music.stop(); if (prev) Music.reveal(); }
    else if (game.state === "board") { Music.stop(); if (prev) Music.board(); }
    else if (game.state === "end") { Music.stop(); if (prev) { Music.fanfare(); setTimeout(() => game.state === "end" && Music.play("lobby"), 2600); } }
  }

  function render() {
    if (!game) return;
    clearInterval(tick);
    sound();
    const { state, q } = game, Q = QUESTIONS[q];
    const top = `<div class="h-top"><p class="eyebrow">${esc(SUBTITLE)}</p><p class="eyebrow" style="color:var(--soft)">KOD: <span style="color:var(--gold)">${g}</span> · ${players.length} peserta</p></div>`;
    let body = "", label = "Seterusnya ▶";
    if (state === "lobby") {
      label = "Mula kuiz ▶";
      const recent = players.slice().sort((a, b) => (b.joined || 0) - (a.joined || 0)).slice(0, 80);
      body = `<div class="lobby">
        <div style="display:flex;flex-direction:column;align-items:center;gap:1vw"><div class="qr" id="qr"></div>
          <p style="font-size:1.1vw;color:var(--soft);max-width:24vw;text-align:center;word-break:break-all">${esc(joinUrl)}</p></div>
        <div style="display:flex;flex-direction:column;gap:1.4vw">
          <p class="eyebrow" style="font-size:1.2vw">Imbas kod QR untuk sertai</p>
          <h1 class="disp" style="font-size:6.5vw">${esc(TITLE.split(" ")[0])} <span class="gold">${esc(TITLE.split(" ").slice(1).join(" "))}</span></h1>
          <div style="display:flex;gap:3vw;align-items:flex-end">
            <div><p style="font-size:1.1vw;color:var(--soft);font-weight:800;letter-spacing:.2em">KOD PERMAINAN</p><p class="disp gold" style="font-size:7vw">${g}</p></div>
            <div><p style="font-size:1.1vw;color:var(--soft);font-weight:800;letter-spacing:.2em">PESERTA</p><p class="disp" style="font-size:7vw;color:var(--teal)">${players.length}</p></div>
          </div>
          <div class="names">${recent.map(p => `<span>${esc(p.name)}</span>`).join("")}</div>
        </div></div>`;
    } else if (state === "question") {
      label = "Tamat masa ▶";
      const n = qAnswers(q).length;
      body = `<div style="display:flex;justify-content:space-between;align-items:center;gap:3vw">
          <div style="display:flex;flex-direction:column;gap:1.2vw;flex:1"><p class="eyebrow" style="font-size:1.3vw">Kenyataan ${q + 1} / ${N} · Betul atau salah?</p>
          <h1 class="disp" style="font-size:4.6vw;line-height:1.02">“${esc(Q.t)}”</h1></div>
          <div class="timer disp" id="tm">${QUESTION_TIME}</div></div>
        <div style="flex:1"></div>
        <p style="font-size:1.6vw;font-weight:800;color:var(--soft)"><span style="color:var(--gold)" id="na">${n}</span> / ${players.length} telah menjawab</p>
        <div class="opts"><div class="opt t disp">✔ Betul</div><div class="opt f disp">✘ Salah</div></div>`;
    } else if (state === "reveal") {
      label = q >= N - 1 ? "Keputusan akhir ▶" : "Kedudukan ▶";
      const qa = qAnswers(q), nt = qa.filter(a => a.choice === true).length, nf = qa.filter(a => a.choice === false).length, tot = Math.max(1, qa.length);
      const pc = Math.round(100 * qa.filter(a => a.correct).length / tot);
      body = `<div style="display:flex;flex-direction:column;gap:1vw"><p class="eyebrow" style="font-size:1.3vw">Kenyataan ${q + 1} / ${N}</p>
          <h1 class="disp" style="font-size:3.4vw;line-height:1.02">“${esc(Q.t)}”</h1></div>
        <div class="card fade" style="padding:1.8vw 2.4vw;display:flex;gap:2.4vw;align-items:center;border-color:${Q.a ? "var(--teal)" : "var(--orange)"}">
          <p class="disp" style="font-size:5vw;white-space:nowrap;color:${Q.a ? "var(--teal)" : "var(--orange)"}">${Q.a ? "Betul · fakta" : "Salah · mitos"}</p>
          <p style="font-size:1.6vw;line-height:1.45">${esc(Q.e)}</p></div>
        <div style="flex:1"></div>
        <p style="font-size:1.6vw;font-weight:800;color:var(--soft)"><span style="color:var(--gold)">${pc}%</span> peserta menjawab dengan tepat</p>
        <div class="opts">
          <div class="opt t disp ${Q.a ? "" : "dim"}">✔ Betul<span class="cnt">${nt}</span><i class="bar" style="width:${100 * nt / tot}%"></i></div>
          <div class="opt f disp ${Q.a ? "dim" : ""}">✘ Salah<span class="cnt">${nf}</span><i class="bar" style="width:${100 * nf / tot}%"></i></div></div>`;
    } else if (state === "board") {
      label = "Soalan seterusnya ▶";
      const t = (game.top || []).slice(0, 5), mx = Math.max(1, ...t.map(x => x.score));
      body = `<p class="eyebrow" style="font-size:1.3vw">Selepas ${q + 1} / ${N} soalan</p><h1 class="disp" style="font-size:5vw">Papan <span class="gold">kedudukan</span></h1>
        <div style="display:flex;flex-direction:column;gap:1vw;flex:1;justify-content:center">${t.map((p, i) => `
          <div class="lb-row" style="animation-delay:${i * .08}s"><span class="r">${i + 1}</span>
            <div style="display:flex;flex-direction:column;gap:.5vw"><span>${esc(p.name)}</span><span style="display:block;height:.6vw;border-radius:.3vw;width:${Math.max(4, 100 * p.score / mx)}%;background:linear-gradient(90deg,var(--teal),var(--gold))"></span></div>
            <span style="color:var(--gold)">${p.score}</span></div>`).join("") || `<p style="font-size:1.6vw;color:var(--soft)">Belum ada markah.</p>`}</div>`;
    } else if (state === "end") {
      label = "";
      const t = game.top || [], P = [t[1], t[0], t[2]], H = ["16vw", "22vw", "12vw"], C = ["#C3CAE8", "#FFC23D", "#FF8A3D"], R = [2, 1, 3];
      body = `<div style="text-align:center"><p class="eyebrow" style="font-size:1.3vw">Keputusan akhir</p><h1 class="disp" style="font-size:5vw">Tahniah, <span class="gold">juara!</span></h1></div>
        <div class="podium">${P.map((p, i) => p ? `<div class="pod fade" style="animation-delay:${[.6, 1.2, 0][i]}s;animation-fill-mode:both"><p class="nm">${esc(p.name)}</p><p class="sc">${p.score} markah</p>
          <div class="blk disp" style="height:${H[i]};background:${C[i]}">${R[i]}</div></div>` : `<div class="pod"></div>`).join("")}</div>
        <p style="text-align:center;font-size:1.3vw;color:var(--soft)">${t.slice(3, 10).map((p, i) => `${i + 4}. ${esc(p.name)} (${p.score})`).join(" · ")}</p>`;
    }
    app.innerHTML = `${DEMO ? `<div class="banner">MOD DEMO — data hanya dalam pelayar ini. Isi firebaseConfig untuk acara sebenar.</div>` : ""}
      <div class="h-wrap">${top}${body}</div>
      <div class="h-ctrl"><button class="btn ghost" id="mu">${Music.muted ? "🔇" : "🔊"} Muzik</button>${state === "lobby" ? `<button class="btn ghost" id="ng">Permainan baharu</button>` : ""}${label ? `<button class="btn" id="nx">${label}</button>` : ""}</div>`;
    const nx = document.getElementById("nx"); if (nx) nx.onclick = next;
    const ng = document.getElementById("ng"); if (ng) ng.onclick = newGame;
    document.getElementById("mu").onclick = e => { e.currentTarget.textContent = (Music.toggle() ? "🔇" : "🔊") + " Muzik"; };
    if (state === "lobby") {
      const box = document.getElementById("qr");
      if (window.qrcode) { const qr = qrcode(0, "M"); qr.addData(joinUrl); qr.make(); box.innerHTML = qr.createSvgTag({ scalable: true, margin: 0 }); }
      else box.innerHTML = `<img alt="Kod QR" src="https://api.qrserver.com/v1/create-qr-code/?size=600x600&margin=0&data=${encodeURIComponent(joinUrl)}">`;
    }
    if (state === "question") {
      const t0 = game.qStart || Date.now();
      const upd = () => {
        const left = Math.max(0, Math.ceil(QUESTION_TIME - (Date.now() - t0) / 1000));
        const el = document.getElementById("tm"); if (el) el.textContent = left;
        if (left !== lastLeft) { if (left <= 5 && left > 0) Music.tick(left); if (left === 0 && lastLeft !== null) Music.timeUp(); lastLeft = left; }
        const n = qAnswers(q).length, na = document.getElementById("na"); if (na) na.textContent = n;
        if (left <= 0 || (players.length > 0 && n >= players.length)) { clearInterval(tick); if (game.state === "question" && game.q === q) next(); }
      };
      upd(); tick = setInterval(upd, 250);
    }
  }
  A.watchGame(g, d => { if (d) { game = d; render(); } });
  A.watchPlayers(g, p => { if (game?.state === "lobby" && p.length > players.length) Music.join(); players = p; if (game?.state === "lobby") render(); else { const s = document.querySelector(".h-top .eyebrow:last-child"); if (s) s.innerHTML = `KOD: <span style="color:var(--gold)">${g}</span> · ${players.length} peserta`; } });
  A.watchAnswers(g, a => { answers = a; if (game?.state === "reveal") render(); });
}

/* ======================================================================
   PLAYER
   ====================================================================== */
async function player(AP) {
  const banner = DEMO ? `<div class="banner">MOD DEMO</div>` : "";
  let g = params.get("g");
  if (!g) {
    app.innerHTML = `${banner}<div class="p-wrap"><div class="p-center"><p class="eyebrow">${esc(SUBTITLE)}</p>
      <h1 class="disp" style="font-size:52px">${esc(TITLE.split(" ")[0])} <span class="gold">${esc(TITLE.split(" ").slice(1).join(" "))}</span></h1>
      <input id="code" inputmode="numeric" maxlength="6" placeholder="Kod permainan"><button class="btn" id="go" style="width:100%">Seterusnya</button></div></div>`;
    await new Promise(res => { const go = () => { const v = document.getElementById("code").value.trim(); if (v) { g = v; res(); } }; document.getElementById("go").onclick = go; document.getElementById("code").onkeydown = e => { if (e.key === "Enter") go(); }; });
    history.replaceState(null, "", `?g=${g}${params.has("demo") ? "&demo" : ""}`);
  }
  let A;
  try { A = await AP; } catch (e) { return showError(e, "muat Firebase"); }
  const KP = `kuiz:${g}:${params.get("slot") || ""}`;
  let pid = localStorage.getItem(KP + "pid"), name = localStorage.getItem(KP + "name");
  const ans = JSON.parse(localStorage.getItem(KP + "ans") || "{}");
  const seen = {};
  const saveAns = () => localStorage.setItem(KP + "ans", JSON.stringify(ans));
  const total = () => Object.values(ans).reduce((s, a) => s + (a.points || 0), 0);

  let exists;
  try { exists = await withTimeout(A.getGame(g)); } catch (e) { return showError(e, "peserta"); }
  if (!exists) {
    app.innerHTML = `${banner}<div class="p-wrap"><div class="p-center"><div class="big-ic" style="background:rgba(255,77,94,.2);color:var(--red)">!</div>
      <h2 class="disp" style="font-size:40px">Kod tidak dijumpai</h2><p style="color:var(--soft)">Semak kod ${esc(g)} pada skrin.</p>
      <button class="btn" onclick="location.href=location.pathname">Cuba lagi</button></div></div>`;
    return;
  }
  if (!pid || !name) {
    app.innerHTML = `${banner}<div class="p-wrap"><div class="p-center"><p class="eyebrow">Kod ${esc(g)}</p>
      <h1 class="disp" style="font-size:48px">Siapa <span class="gold">nama anda?</span></h1>
      <input id="nm" maxlength="18" placeholder="Nama panggilan" autocomplete="off"><button class="btn" id="go" style="width:100%">Sertai ▶</button>
      <p style="font-size:13px;color:var(--soft)">Nama akan dipaparkan pada skrin besar.</p></div></div>`;
    await new Promise(res => {
      const go = async () => {
        const v = document.getElementById("nm").value.trim().replace(/\s+/g, " ");
        if (v.length < 2) return;
        name = v; pid = Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
        document.getElementById("go").disabled = true; document.getElementById("go").textContent = "Menyambung…";
        for (let i = 0; i < 5; i++) { try { await A.addPlayer(g, pid, { name, joined: Date.now() }); break; } catch (e) { await sleep(600 * (i + 1) + Math.random() * 600); } }
        localStorage.setItem(KP + "pid", pid); localStorage.setItem(KP + "name", name); res();
      };
      document.getElementById("go").onclick = go; document.getElementById("nm").onkeydown = e => { if (e.key === "Enter") go(); };
    });
  }
  try { await navigator.wakeLock?.request("screen"); } catch (e) {}

  let game = null, tick = null;
  async function submit(choice) {
    const q = game.q; if (ans[q]) return;
    const el = Date.now() - (seen[q] || Date.now()), Q = QUESTIONS[q], correct = choice === Q.a;
    const points = correct ? Math.round(500 + 500 * Math.max(0, 1 - el / (QUESTION_TIME * 1000))) : 0;
    ans[q] = { choice, correct, points }; saveAns(); navigator.vibrate?.(40); render();
    const d = { q, pid, name, choice, correct, points, ms: el };
    for (let i = 0; i < 6; i++) { try { await A.addAnswer(g, `${q}_${pid}`, d); break; } catch (e) { await sleep(500 * (i + 1) + Math.random() * 800); } }
  }
  function render() {
    clearInterval(tick);
    if (!game) return;
    const { state, q } = game, Q = QUESTIONS[q], a = ans[q];
    const head = `<div class="p-head"><span>👤 <b>${esc(name)}</b></span><span>Markah: <b style="color:var(--gold)">${total()}</b></span></div>`;
    let body = "";
    if (state === "lobby") {
      body = `<div class="p-center"><div class="big-ic" style="background:rgba(63,224,208,.18);color:var(--teal)">✔</div>
        <h2 class="disp" style="font-size:44px">Anda sudah <span class="gold">masuk!</span></h2><p style="color:var(--soft)">Lihat nama anda di skrin besar.<br>Tunggu hos memulakan kuiz.</p></div>`;
    } else if (state === "question" && !a) {
      if (!seen[q]) seen[q] = Date.now();
      body = `<p class="eyebrow">Kenyataan ${q + 1} / ${N}</p><p class="stmt-p">“${esc(Q.t)}”</p>
        <div class="tbar"><i id="tb" style="width:100%"></i></div>
        <button class="ans t disp" data-c="1">✔ Betul<small>FAKTA</small></button>
        <button class="ans f disp" data-c="0">✘ Salah<small>MITOS</small></button>`;
    } else if (state === "question" && a) {
      body = `<div class="p-center"><div class="big-ic" style="background:rgba(255,194,61,.18);color:var(--gold)">⏳</div>
        <h2 class="disp" style="font-size:40px">Jawapan <span class="gold">dihantar</span></h2><p style="color:var(--soft)">Anda pilih <b style="color:${a.choice ? "var(--teal)" : "var(--orange)"}">${a.choice ? "BETUL" : "SALAH"}</b>. Tunggu keputusan…</p></div>`;
    } else if (state === "reveal") {
      const ok = a?.correct;
      body = `<div class="p-center"><div class="big-ic" style="background:${!a ? "rgba(255,255,255,.1)" : ok ? "rgba(61,220,132,.2)" : "rgba(255,77,94,.2)"};color:${!a ? "var(--soft)" : ok ? "var(--green)" : "var(--red)"}">${!a ? "…" : ok ? "✔" : "✘"}</div>
        <h2 class="disp" style="font-size:46px">${!a ? "Tidak sempat" : ok ? `<span class="gold">Tepat!</span>` : "Kurang tepat"}</h2>
        ${a ? `<p class="disp" style="font-size:34px;color:var(--gold)">+${a.points}</p>` : ""}
        <p style="color:var(--soft);font-size:15px;line-height:1.5">Jawapan: <b style="color:${Q.a ? "var(--teal)" : "var(--orange)"}">${Q.a ? "BETUL · FAKTA" : "SALAH · MITOS"}</b><br>${esc(Q.e)}</p></div>`;
    } else if (state === "board" || state === "end") {
      const r = game.ranks?.[pid];
      body = `<div class="p-center"><p class="eyebrow">${state === "end" ? "Keputusan akhir" : "Kedudukan semasa"}</p>
        <h2 class="disp" style="font-size:96px"><span class="gold">${r ? "#" + r : "—"}</span></h2>
        <p style="color:var(--soft)">${r ? `daripada ${game.total} peserta` : "Kedudukan belum tersedia"}</p>
        <p class="disp" style="font-size:36px">${total()} markah</p>
        ${state === "end" ? `<p style="color:var(--soft);line-height:1.5">Terima kasih kerana menyertai!<br>Ingat: <b style="color:var(--gold)">Talian HEAL 15555</b></p>` : `<p style="color:var(--soft)">Bersedia untuk soalan seterusnya…</p>`}</div>`;
    }
    app.innerHTML = `${banner}<div class="p-wrap">${head}${body}</div>`;
    app.querySelectorAll(".ans").forEach(b => b.onclick = () => submit(b.dataset.c === "1"));
    if (state === "question" && !a) {
      tick = setInterval(() => { const tb = document.getElementById("tb"); if (tb) tb.style.width = Math.max(0, 100 - 100 * (Date.now() - seen[q]) / (QUESTION_TIME * 1000)) + "%"; }, 250);
    }
  }
  A.watchGame(g, d => { if (d) { game = d; render(); } });
}

/* ---------- boot ---------- */
const AP = DEMO ? Promise.resolve(localAdapter()) : withTimeout(firebaseAdapter(), 20000);
AP.catch(() => {});
IS_HOST ? host(AP) : player(AP);
</script>
</body>
</html>
